<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Copilot Web</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <style>
    /* Basic page styling */
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
  background: #f4f4f9;
  color: #333;
}

header, footer {
  background: #222;
  color: #fff;
  text-align: center;
  padding: 1rem;
}

main {
  padding: 2rem;
}

textarea {
  width: 100%;
  height: 100px;
  margin-bottom: 1rem;
  padding: 0.5rem;
  font-size: 1rem;
}

button {
  background: #0078d7;
  color: #fff;
  border: none;
  padding: 0.7rem 1.2rem;
  cursor: pointer;
  font-size: 1rem;
}

button:hover {
  background: #005a9e;
}

#output {
  margin-top: 1rem;
  padding: 1rem;
  background: #e9ecef;
  border-radius: 5px;
}

  </style>
  <header>
    <h1>Welcome to My Copilot</h1>
  </header>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
  const askBtn = document.getElementById("askBtn");
  const inputBox = document.getElementById("userInput");
  const outputDiv = document.getElementById("output");

  askBtn.addEventListener("click", async () => {
    const input = inputBox.value.trim();
 
    if (!input) {
      outputDiv.textContent = "Please type something first!";
      return;
    }

    outputDiv.textContent = "Thinking... 🤔";

    try {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer YOUR_API_KEY"
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",   
          messages: [{ role: "user", content: input }]
        })
      });

      const data = await response.json();
      outputDiv.textContent = data.choices[0].message.content;
    } catch (error) {
      console.error(error);
      outputDiv.textContent = "Oops! Something went wrong.";
    }
  });
});


  </script>
  <main>
    <p>This is a basic HTML skeleton with CSS and JS linked.</p>

    <!-- Input box -->
    <textarea id="userInput" placeholder="Type something..."></textarea>
    <button id="askBtn">Ask Copilot</button>

    <!-- Output -->
    <div id="output"></div>
  </main>

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 My Copilot Web</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
